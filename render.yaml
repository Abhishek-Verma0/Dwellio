# Render Blueprint — ONE web service running both halves.
#
#   Render dashboard -> New -> Blueprint -> pick this repo -> Apply
#
# Everything is in the Dockerfile, so there is no start command, no root
# directory, and no URLs to wire between services. One URL, one cold start.
services:
  - type: web
    name: dwellio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # The only value you must not hardcode. Render generates it once and keeps
      # it stable across deploys, so existing tokens survive a redeploy.
      - key: SECRET_KEY
        generateValue: true
